<!doctype html>
<html lang="hr">
<head>

<title>Bela Blok</title>
<style>
@font-face{font-family:'Baloo 2';font-weight:400 800;font-display:swap;src:url(baloo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Baloo 2';font-weight:400 800;font-display:swap;src:url(baloo-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Baloo 2';font-weight:400 800;font-display:swap;src:url(baloo-vietnamese.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
:root{--paper:#fbf8ef;--ink:#1b1b18;--soft:#6f6a5c;--rule:#b9cde0;--card:#fffdf6;--green:#1f5a3c;--on-green:#fbf8ef;--bad:#b3261e;--hl:#d6ecd9;--mi:#2b8a4e;--vi:#b8651c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#141612;--ink:#ecebe2;--soft:#9c9a8e;--rule:#2f3d35;--card:#e8e3d3;--green:#6fbf8f;--on-green:#141612;--bad:#ef7a6e;--hl:#1f3a2a;--mi:#4fa877;--vi:#b0722a;color-scheme:dark}}
:root[data-theme=dark]{--paper:#141612;--ink:#ecebe2;--soft:#9c9a8e;--rule:#2f3d35;--card:#e8e3d3;--green:#6fbf8f;--on-green:#141612;--bad:#ef7a6e;--hl:#1f3a2a;--mi:#4fa877;--vi:#b0722a;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);touch-action:manipulation}
body{margin:0;color:var(--ink);font:500 18px/1.35 'Baloo 2',ui-rounded,system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{position:relative;display:flex;justify-content:center;max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 4px}
h1{margin:0;font-size:30px;line-height:1.1;color:var(--green);border-bottom:4px double var(--green)}
.theme{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top));background:none;border:0;font-size:17px;padding:4px 0 4px 8px;color:var(--soft);text-decoration:underline;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:8px 16px 16px}
h2{margin:18px 0 8px;font-size:22px;color:var(--green)}
.lbl{display:block;font-size:15px;color:var(--soft);margin:14px 0 4px}
.muted{color:var(--soft)}.small{font-size:15px}.center{text-align:center}.bad{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1;min-width:0}
input,select,textarea{width:100%;padding:8px 2px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;font-size:18px;-webkit-appearance:none;appearance:none}
input[type=number]{text-align:center;font-size:28px}
input::-webkit-inner-spin-button{-webkit-appearance:none}
input::placeholder{color:var(--soft);opacity:.6}
.btn{border:2px solid var(--ink);background:transparent;border-radius:12px;padding:10px 12px;font-size:18px;cursor:pointer}
.btn.main{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.red{border-color:var(--bad);color:var(--bad)}
.btn.on{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35}
.wide{padding:14px;font-size:20px}
.link{background:none;border:0;padding:6px 0;font-size:16px;text-decoration:underline;cursor:pointer}
.pick label{position:relative}.pick input{position:absolute;opacity:0}
.pick span{display:block;text-align:center;border:2px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer}
.pick input:checked+span{background:var(--ink);color:var(--paper)}
.pick input:focus-visible+span{outline:2px dashed var(--green);outline-offset:2px}
/* score sheet */
.sheet{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{text-align:center;padding:0 4px;border-bottom:1px solid var(--rule)}
.sheet th+th,.sheet td+td{border-left:2px solid var(--ink)}
.sheet th{font-size:32px;line-height:1;padding-top:8px;border-bottom:2px solid var(--ink)}
.sheet th small{display:block;font-size:14px;color:var(--soft);padding:4px 0 6px;overflow-wrap:anywhere}
.sheet td{position:relative;font-size:24px;height:40px}
.sheet .mark{display:inline-block;width:22px;height:22px;vertical-align:-4px;margin-left:5px}
.sheet .n{position:relative}.sheet .ex{position:absolute;left:100%;top:0;white-space:nowrap} /* * and +zvanja hang off the number so it stays centred */
.sheet tr.hand{cursor:pointer}.sheet tr.hand:active td,.sheet tr.editing td{background:var(--hl)}
.sheet sup{font-size:12px;color:var(--soft);margin-left:2px}
.sheet .zv{font-size:13px;color:var(--green);margin-left:4px}
.sheet .tot td{font-size:36px;height:58px;border-top:5px double var(--ink);border-bottom:0}
.sheet th.lead,.sheet .tot td.lead{background:var(--hl)}
.sheet th.lead{color:var(--green)}
.diff{text-align:center;font-size:20px;margin:6px 0 0}
.note{text-align:center;color:var(--soft);font-size:14px;margin:4px 0 0}
/* tijek igre */
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px;margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y;font-family:inherit}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:4px 8px;font-size:15px;white-space:nowrap;pointer-events:none}
.sheet.stat th{font-size:22px}
.sheet.stat td{font-size:20px;height:36px}
.sheet.stat td:first-child{text-align:left;font-size:16px;color:var(--soft)}
/* dealer seat map */
.seats{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:". p2 ." "p3 t p1" ". p0 .";align-items:center;justify-items:center;max-width:340px;margin:6px auto 0}
.p0{grid-area:p0}.p1{grid-area:p1}.p2{grid-area:p2}.p3{grid-area:p3}
.seat{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px;color:var(--green);font-size:15px;cursor:pointer;transition:transform .08s}
.seat span{color:var(--soft);white-space:nowrap}.seat.on span{color:var(--ink);font-weight:700}
.seat svg{width:46px;height:46px}.seat:active{transform:scale(.94)}
.table{grid-area:t;display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--green);box-shadow:inset 0 0 0 5px rgba(0,0,0,.18)}
.table svg.s{width:30px;height:30px}
/* hand entry */
.entry{position:relative;border:2px solid var(--ink);border-radius:16px;padding:4px 12px 38px;margin-top:16px}
.pip{position:absolute;width:22px;height:22px}.pip.tr{top:10px;right:10px}.pip.bl{bottom:10px;left:10px;transform:rotate(180deg)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cols>div{min-width:0}
.colh{text-align:center;font-size:24px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 8px;font-size:16px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.red{border-color:var(--bad);color:var(--bad)}
.chip.guest{border-style:dashed}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dealer{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:12px 0 0;font-size:19px}
.dealer i{width:22px;height:22px}
.listed{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.listed button{border:0;background:none;padding:2px 0;color:var(--green);font-size:16px;text-decoration:underline;cursor:pointer}
.preview{text-align:center;font-size:26px;margin:14px 0 10px;font-variant-numeric:tabular-nums}
.flash{border:4px double var(--green);border-radius:16px;color:var(--green);text-align:center;padding:14px;font-size:22px;margin:8px 0 12px}
/* turnir */
textarea{resize:vertical;line-height:1.4}
.bracket{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:4px 16px 12px}
.rnd{flex:0 0 150px;display:flex;flex-direction:column}
.rh{text-align:center;font-size:15px;color:var(--soft);margin-bottom:6px}
.ms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.match{border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.tm{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 8px;font-size:16px;overflow-wrap:anywhere;cursor:pointer}
.tm+.tm{border-top:1px solid var(--rule)}
.tm.win{background:var(--hl);color:var(--green);font-weight:700}
.tm.out{color:var(--soft);text-decoration:line-through}
span.tm,.tm:disabled{cursor:default}
/* lists */
.line{border-bottom:1px solid var(--rule);padding:10px 0}
.line .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);cursor:pointer}
.item .st{display:block}
.name{font-size:22px;overflow-wrap:anywhere}
.st{font-size:15px;color:var(--soft);margin-top:2px}
.icon{background:none;border:0;font-size:18px;padding:4px 6px;cursor:pointer}
.item{display:flex;align-items:center;gap:12px}.item>.body{flex:1;min-width:0}
.no{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:42px;height:56px;background:var(--card);color:#1b1b18;border:1.5px solid #1b1b18;border-radius:7px;box-shadow:1px 2px 0 rgba(0,0,0,.18);font-size:20px;font-weight:600;line-height:1}
.no i{width:14px;height:14px}
.day{border-bottom:1px solid var(--rule)}
.day summary{display:flex;align-items:baseline;gap:10px;padding:12px 0;cursor:pointer;list-style:none;font-size:19px}
.day summary::-webkit-details-marker{display:none}
.day summary::before{content:"›";display:inline-block;width:12px;font-size:24px;line-height:1;color:var(--green);transition:transform .2s}
.day[open] summary::before{transform:rotate(90deg)}
.day summary .muted{margin-left:auto;flex:0 0 auto}
.day .item:last-child{border-bottom:0}
.hrow{display:flex;justify-content:space-between;gap:8px;font-size:19px}.hrow.win{color:var(--green)}
nav{z-index:5;position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--paper);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:200px;background:none;border:0;padding:8px 0 10px;font-size:18px;color:var(--soft);cursor:pointer}
nav button{transition:color .25s}nav button.on{color:var(--ink)}
.ind{position:absolute;left:0;bottom:calc(6px + env(safe-area-inset-bottom));height:2.5px;border-radius:2px;background:var(--ink);transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s}
/* page change: slide in from the side we're heading to */
body{overflow-x:hidden}
#app.in-r{animation:inR .3s cubic-bezier(.2,.8,.2,1)}#app.in-l{animation:inL .3s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{opacity:0;transform:translateX(32px)}}@keyframes inL{from{opacity:0;transform:translateX(-32px)}}
:focus-visible{outline:2px dashed var(--green);outline-offset:2px}
/* playing cards: srce, žir, list, zvono */
svg.s{display:block;width:100%;height:100%}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px}
.fan{position:relative;width:104px;height:50px;flex:0 0 auto}
.fan i{position:absolute;left:50%;top:2px;display:grid;place-items:center;width:26px;height:38px;margin-left:-13px;background:var(--card);border:1.5px solid #1b1b18;border-radius:5px;box-shadow:1px 2px 0 rgba(0,0,0,.18);transform:rotate(var(--r));transform-origin:50% 226%;transition:transform .25s}
.fan i svg{width:17px;height:17px}
.fan i:nth-child(1){--r:-27deg}.fan i:nth-child(2){--r:-9deg}.fan i:nth-child(3){--r:9deg}.fan i:nth-child(4){--r:27deg}
.fan:active i:nth-child(1){--r:-36deg}.fan:active i:nth-child(2){--r:-12deg}.fan:active i:nth-child(3){--r:12deg}.fan:active i:nth-child(4){--r:36deg}
.fan.big{width:208px;height:100px;margin:28px auto 18px}
.fan.big i{top:4px;width:52px;height:76px;margin-left:-26px;border-radius:9px;border-width:2px}
.fan.big i svg{width:34px;height:34px}
nav i{display:block;width:24px;height:24px;margin:0 auto 2px;transition:transform .2s}
nav button:not(.on) i{filter:grayscale(1);opacity:.45}
nav button.on i{transform:translateY(-3px)}
.btn,.chip,.pick span{transition:transform .08s}
.btn:active:not(:disabled),.chip:active,.pick span:active{transform:translateY(2px) scale(.97)}
.flash svg{display:inline-block;width:30px;height:30px;vertical-align:-7px;margin-right:8px;transform-origin:50% 10%;animation:ring .5s ease-in-out 4}
.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:10}
.confetti i{position:absolute;top:-16px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
@keyframes ring{25%{transform:rotate(20deg)}75%{transform:rotate(-20deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="brand"><h1>Bela Blok</h1><span id="hfan"></span></div><button id="themeBtn" class="theme" onclick="cycleTheme()" aria-label="Promijeni temu (auto / dan / noć)">auto</button></header>
<main id="app"></main>
<nav>
  <span class="ind" aria-hidden="true"></span>
  <button data-v="game" onclick="go('game')"><i data-s="srce"></i><span>Igra</span></button>
  <button data-v="players" onclick="go('players')"><i data-s="zir"></i><span>Igrači</span></button>
  <button data-v="history" onclick="histId=null;tid=null;go('history')"><i data-s="list"></i><span>Povijest</span></button>
  <button data-v="tour" onclick="tid=null;go('tour')"><i data-s="zvono"></i><span>Turnir</span></button>
</nav>
<script src="bela.js"></script>
<script>
const KEY = 'belablok';
let db = null;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch {}
db = db || { players: [], games: [], theme: 'auto' };
db.tournaments ??= [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { alert('Spremanje nije uspjelo!'); } };

let pickDealer = false, lastPage = null, tid = null, histTab = 'games';
let view = 'game', draft = null, shownId = null, pickBelot = false, histId = null, cd = null, picks = [null, null, null, null], target = 1001;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const sum = a => a.reduce((x, y) => x + y, 0);
const pname = id => db.players.find(p => p.id === id)?.name ?? '?';
const teamName = tm => tm.map(pname).join(' & ');
const MV = i => i ? 'VI' : 'MI';
const active = () => db.games.find(g => winner(g) == null);
const zvOf = (h, i) => sum(h.zv[i]) + h.bela[i] * 20;
// Croatian/German-suited cards. Fixed colours on purpose: they're printed card faces, not theme ink.
const SUIT = {
srce: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path fill="#e0332a" stroke="#5a120e" stroke-width="1.1" stroke-linejoin="round" d="M12 21.2C5.6 16.9 2.2 13.2 2.2 8.9A4.9 4.9 0 0 1 12 6.9a4.9 4.9 0 0 1 9.8 2c0 4.3-3.4 8-9.8 12.3z"/><path fill="#a81f1a" d="M5 15.6c2 2 4.3 3.7 7 5.6 2.7-1.9 5-3.6 7-5.6z"/></svg>',
  zir: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="20.6" r="2.4" fill="#2e8b34" stroke="#173f12" stroke-width="1"/><path fill="#8a3b1e" stroke="#3a1a08" stroke-width="1.1" stroke-linejoin="round" d="M6.3 11.2h11.4v4.2c0 2.6-2.5 4.3-5.7 4.3s-5.7-1.7-5.7-4.3z"/><path fill="#d8402a" d="M6.85 11.8h10.3v2.2H6.85z"/><path fill="#f3c51c" stroke="#3a1a08" stroke-width="1.1" stroke-linejoin="round" d="M6.8 11.2V8.4a5.2 5.2 0 0 1 10.4 0v2.8z"/><path fill="none" stroke="#fff6b8" stroke-width="1.2" stroke-linecap="round" d="M9 9.6V8.4a3 3 0 0 1 1.4-2.5"/></svg>',
  list: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#8a5a1c" stroke-width="1.6" stroke-linecap="round" d="M12 18.6c0 2 .6 3.4 2.2 4.4"/><path fill="#3c9a3a" d="M12 18.6C9 21 3.5 19 3.2 14 3 10.5 4 7 5 4.5c2 1.5 3.6 1.9 4.6 2.1Q10.5 4 12 1.8q1.5 2.2 2.4 4.8c1-.2 2.6-.6 4.6-2.1 1 2.5 2 6 1.8 9.5-.3 5-5.8 7-8.8 4.6z"/><path fill="#ecc935" d="M12 18.6C9 21 3.5 19 3.2 14 3 10.5 4 7 5 4.5c2 1.5 3.6 1.9 4.6 2.1Q10.5 4 12 1.8z"/><path fill="none" stroke="#1d3d14" stroke-width="1.1" stroke-linejoin="round" d="M12 18.6C9 21 3.5 19 3.2 14 3 10.5 4 7 5 4.5c2 1.5 3.6 1.9 4.6 2.1Q10.5 4 12 1.8q1.5 2.2 2.4 4.8c1-.2 2.6-.6 4.6-2.1 1 2.5 2 6 1.8 9.5-.3 5-5.8 7-8.8 4.6z"/><path fill="none" stroke="#1d3d14" stroke-width=".8" stroke-linecap="round" d="M12 4.5v14M12 9l-3.6-2M12 12.5l-5.2-2.4M12 16l-5.6-1.6M12 9l3.6-2M12 12.5l5.2-2.4M12 16l5.6-1.6"/></svg>',
  zvono: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12.5" r="9" fill="#f3c51c"/><path fill="#d8402a" d="M3.2 14.2Q12 10.4 20.4 9.3L21 12.3Q12.6 13.6 4.2 16.9z"/><path fill="none" stroke="#2e8b34" stroke-width="1.8" stroke-linecap="round" d="M10 19.2c1.1-1.4 2.2 1 3.3-.4s2.2 1 3.3-.4"/><path stroke="#3a2a05" stroke-width="2.4" stroke-linecap="round" d="M8.6 6.2l1.8 1.8"/><circle cx="12" cy="12.5" r="9" fill="none" stroke="#3a2a05" stroke-width="1.1"/></svg>',
};
const SUITS = Object.keys(SUIT);
const MARK = {
  pad: '<svg class="s" viewBox="0 0 24 24"><title>pad</title><circle cx="12" cy="12" r="11.5" fill="#d42f2a"/><g transform="rotate(28 12 12)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="17.6" r="2.1" fill="#fff" stroke="none"/><path d="M12 15.1V9.6L9.2 5.4M12 9.6l2.8-4.2M12 13.4l-3.4-2.6M12 13.4l3.4-2.6"/></g><path fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" d="M4.6 8.6h2.6M4.2 11.4h2"/></svg>',
  stiglja: '<svg class="s" viewBox="0 0 24 24"><title>štiglja</title><circle cx="12" cy="12" r="11.5" fill="#d42f2a"/><path fill="#fff" d="M5.6 6.2Q12 3.4 18.4 6.2 19 13.4 16.2 17.2 12 21.2 7.8 17.2 5 13.4 5.6 6.2z"/><g fill="none" stroke="#d42f2a" stroke-width="1.5" stroke-linecap="round"><path d="M7.9 10.3q1.4-1.9 2.8 0M13.3 10.3q1.4-1.9 2.8 0"/><path stroke-width="1" d="M7.6 7.6q1.6-1 3 0M13.4 7.6q1.6-1 3 0"/></g><path fill="#d42f2a" d="M8.3 12.6Q12 14 15.7 12.6 15 17 12 17 9 17 8.3 12.6z"/></svg>', // laughing theatre mask
};
const gameNo = g => db.games.filter(x => x.date <= g.date).length; // 1 = first game ever played
const fan = (cls = '') => `<div class="fan ${cls}" aria-hidden="true">${SUITS.map(k => `<i>${SUIT[k]}</i>`).join('')}</div>`;

function applyTheme() {
  document.documentElement.dataset.theme = db.theme;
  $('#themeBtn').textContent = { auto: 'auto', light: 'dan', dark: 'noć' }[db.theme];
}
function cycleTheme() { db.theme = { auto: 'light', light: 'dark', dark: 'auto' }[db.theme]; save(); applyTheme(); }

function go(v) { view = v; render(); }
const TABS = ['game', 'players', 'history', 'tour'];
function placeInd() {
  const sp = $('nav button.on span'), ind = $('.ind');
  if (sp) { const r = sp.getBoundingClientRect(); ind.style.width = r.width + 'px'; ind.style.transform = `translateX(${r.left - ind.parentNode.getBoundingClientRect().left}px)`; }
}
function animatePage() {
  const sub = view === 'history' ? histId || tid : view === 'tour' ? tid : null, page = view + ':' + (sub || ''), app = $('#app');
  if (lastPage && page !== lastPage) {
    const was = TABS.indexOf(lastPage.split(':')[0]), now = TABS.indexOf(view);
    const fwd = now === was ? !!sub : now > was; // same tab: opening a game/tournament goes forward
    app.classList.remove('in-l', 'in-r'); void app.offsetWidth; // restart the animation
    app.classList.add(fwd ? 'in-r' : 'in-l');
  }
  lastPage = page;
}
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  placeInd();
  const g = db.games.find(x => x.id === shownId) || active();
  $('#app').innerHTML = view === 'players' ? playersView() : view === 'history' ? historyView() : view === 'tour' ? tourView() : g ? gameView(g) : newGameView();
  animatePage();
}

/* ---------- Igra ---------- */
function newGameView() {
  picks = picks.map(id => db.players.some(p => p.id === id) ? id : null); // drop deleted players
  const slot = i => `<button class="btn ${picks[i] ? 'on' : ''}" onclick="picks[${i}]=null;render()" ${picks[i] ? `aria-label="Makni ${esc(pname(picks[i]))}"` : 'disabled'}>${picks[i] ? esc(pname(picks[i])) + ' ✕' : '— igrač —'}</button>`;
  return `<h2>Nova igra</h2>${db.players.length ? '' : fan('big') + '<p class="muted center">Dodaj igrače pod <u>Igrači</u> ili igraj s gostima.</p>'}
    <span class="lbl">MI</span><div class="row">${slot(0)}${slot(1)}</div>
    <span class="lbl">VI</span><div class="row">${slot(2)}${slot(3)}</div>
    ${picks.includes(null) ? `<input id="q" type="search" placeholder="Traži igrača…" autocomplete="off" aria-label="Traži igrača"
      oninput="$('#plist').innerHTML=playerChips()" onkeydown="if(event.key==='Enter'){event.preventDefault();$('#plist button')?.click()}">
    <div id="plist" class="chips">${playerChips()}</div>` : ''}
    <span class="lbl">Igra se do</span><div class="row pick">${[501, 701, 1001].map(t =>
      `<label><input type="radio" name="target" value="${t}" ${t === target ? 'checked' : ''} onchange="target=${t}"><span>${t}</span></label>`).join('')}</div>
    <button class="btn main wide" style="width:100%;margin-top:20px" onclick="startGame()">Počni igru</button>`;
}
const fold = s => s.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replace(/đ/g, 'd'); // "ivic" finds "Ivić"
function playerChips() {
  const q = fold($('#q')?.value ?? '');
  const list = db.players.filter(p => !picks.includes(p.id) && fold(p.name).includes(q))
    .sort((a, b) => a.name.localeCompare(b.name, 'hr'));
  const typed = $('#q')?.value.trim() ?? '';
  return list.map(p => `<button class="chip ${p.guest ? 'guest' : ''}" onclick="pickPlayer('${p.id}')">${esc(p.name)}${p.guest ? ' · gost' : ''}</button>`).join('')
    + `<button class="chip guest" onclick="addGuest()">+ ${typed && !nameTaken(typed) ? `„${esc(typed)}” kao gost` : 'Gost'}</button>`;
}
function addGuest() {
  const typed = $('#q').value.trim(), name = (typed && !nameTaken(typed) ? typed : prompt('Ime gosta:', 'Gost')?.trim())?.slice(0, 30);
  if (!name) return;
  const old = db.players.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (old && (!old.guest || picks.includes(old.id))) return alert(old.guest ? 'Taj gost je već u igri.' : 'Igrač s tim imenom već postoji.');
  const id = old?.id ?? uid();
  if (!old) { db.players.push({ id, name, guest: true }); save(); }
  pickPlayer(id);
}
function pickPlayer(id) {
  const typed = !!$('#q').value;
  picks[picks.indexOf(null)] = id; render();
  if (typed) $('#q')?.focus(); // keep the keyboard up while typing names
}
function startGame() {
  if (picks.includes(null)) return alert('Odaberi 4 igrača.');
  db.games.push({ id: uid(), date: Date.now(), teams: [picks.slice(0, 2), picks.slice(2)], target, hands: [], belot: null });
  picks = [null, null, null, null]; save(); render();
}

function sheet(g, edit = true) { // Povijest shows it read-only
  const t = totals(g.hands), w = winner(g);
  const cell = (h, i) => {
    const pad = h.fell && h.caller === i, z = zvOf(h, i);
    const mark = k => `<span class="mark">${MARK[k]}</span>`;
    if (pad) return `<td class="bad"><span class="n">0<span class="ex">${mark('pad')}</span></span></td>`; // fallen team loses its zvanja too
    return `<td><span class="n">${h.score[i]}<span class="ex">${h.caller === i ? '<sup>*</sup>' : ''}${z ? `<span class="zv">+${z}</span>` : ''}${h.stiglja === i ? mark('stiglja') : ''}</span></span></td>`;
  };
  const rows = g.hands.map((h, k) => !edit ? `<tr>${cell(h, 0)}${cell(h, 1)}</tr>` : `<tr class="hand ${draft?.gid === g.id && draft.idx === k ? 'editing' : ''}" role="button" tabindex="0" aria-label="Ispravi ruku ${k + 1}"
    onclick="editHand('${g.id}',${k})" onkeydown="if(event.key==='Enter')this.click()">${cell(h, 0)}${cell(h, 1)}</tr>`);
  while (rows.length < 6) rows.push('<tr><td></td><td></td></tr>'); // empty ruled lines, like paper
  const lead = t[0] === t[1] ? -1 : t[0] > t[1] ? 0 : 1, L = i => lead === i ? 'lead' : '';
  return `<table class="sheet">
      <thead><tr>${[0, 1].map(i => `<th scope="col" class="${L(i)}">${MV(i)}<small>${esc(teamName(g.teams[i]))}</small></th>`).join('')}</tr></thead>
      <tbody>${rows.join('')}</tbody>
      <tfoot><tr class="tot"><td class="${L(0)}">${t[0]}</td><td class="${L(1)}">${t[1]}</td></tr></tfoot></table>
    ${g.hands.length ? `<p class="diff">${w != null ? `Pobjeda ${MV(w)}${g.belot != null ? ' — belot' : ` za ${Math.abs(t[0] - t[1])}`}`
      : lead < 0 ? 'Izjednačeno' : `${MV(lead)} vodi za ${Math.abs(t[0] - t[1])}`}</p>` : ''}
    <p class="note">do ${g.target}</p>`;
}
const SEAT = ['ja', 'desni protivnik', 'partner', 'lijevi protivnik'];
const dealer = (g, k = 0) => ((g.dealer ?? 0) + g.hands.length + k) % 4; // index into SEAT
function rematch(gid) {
  const g = db.games.find(x => x.id === gid);
  if (active()) return alert('Druga igra je već u tijeku.');
  // same teams and target; dealing carries on from where the last game stopped
  db.games.push({ id: uid(), date: Date.now(), teams: g.teams.map(t => [...t]), target: g.target, hands: [], belot: null, dealer: dealer(g) });
  shownId = null; draft = null; save(); render(); scrollTo(0, 0);
}
// Seat map for picking the dealer: me at the bottom, partner across, opponents left and right.
const PERSON = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="7.5" r="4"/><path d="M4 21a8 7 0 0 1 16 0z"/></g></svg>`;
const seats = d => `<div class="seats">${SEAT.map((t, i) => `<button class="seat p${i} ${d === i ? 'on' : ''}" aria-pressed="${d === i}" onclick="setDealer(${i})">${PERSON(d === i)}<span>${t}</span></button>`).join('')}
  <div class="table" aria-hidden="true">${SUIT.zvono}</div></div>`;
function setDealer(i) { const g = active(); g.dealer = ((i - g.hands.length) % 4 + 4) % 4; pickDealer = false; save(); render(); }
function gameView(g) {
  const w = winner(g);
  if (w != null) return `<div class="flash" role="status">${SUIT.zvono}${g.belot != null ? 'BELOT! ' : ''}Pobjeda: ${MV(w)} — ${esc(teamName(g.teams[w]))}!</div>
    ${sheet(g)}${draft?.gid === g.id ? handForm(g) : ''}
    <button class="btn main wide" style="width:100%;margin-top:16px" onclick="rematch('${g.id}')">Iste ekipe, nova igra</button>
    <button class="btn wide" style="width:100%;margin-top:10px" onclick="shownId=null;draft=null;render()">Nova igra s drugim igračima</button>`;
  return `${sheet(g)}
    <div class="dealer"><i>${SUIT[SUITS[g.hands.length % 4]]}</i><span>${dealer(g) ? 'Miješa' : 'Miješam'}</span>
      <button class="chip on" aria-expanded="${pickDealer}" aria-label="Miješa ${SEAT[dealer(g)]}, promijeni" onclick="pickDealer=!pickDealer;render()">${SEAT[dealer(g)]} ▾</button>
      <span class="muted small">zatim ${SEAT[dealer(g, 1)]}</span></div>
    ${pickDealer ? seats(dealer(g)) : ''}
    ${draft?.gid === g.id ? handForm(g) : `
      <div class="row" style="margin-top:16px">
        <button class="btn main wide" style="flex:2" onclick="newHand()">+ Upiši ruku</button>
        <button class="btn red wide" aria-expanded="${pickBelot}" onclick="pickBelot=!pickBelot;render()">BELOT</button></div>
      ${pickBelot ? `<div class="row" style="margin-top:10px"><span class="muted small" style="flex:0 0 auto">Belot za:</span>
        ${[0, 1].map(i => `<button class="btn red" onclick="belot(${i})">${MV(i)}</button>`).join('')}</div>` : ''}`}
    <p class="center" style="margin:14px 0 0"><button class="link bad" onclick="abandonGame()">prekini igru</button></p>`;
}

function newHand() {
  draft = { gid: active().id, idx: null, caller: null, cards: ['', ''], zv: [[], []], bela: [0, 0], stiglja: null };
  pickBelot = false; render();
  $('.entry').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function editHand(gid, k) {
  const h = db.games.find(x => x.id === gid).hands[k];
  draft = { gid, idx: k, caller: h.caller, cards: h.cards ? [...h.cards] : ['', ''], zv: h.zv.map(z => [...z]), bela: [...h.bela], stiglja: h.stiglja };
  pickBelot = false; render();
  $('.entry').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function handForm(g) {
  const d = draft;
  const col = i => `<div>
    <div class="colh">${MV(i)}</div>
    <input id="c${i}" type="number" inputmode="numeric" min="0" max="162" placeholder="0" aria-label="Bodovi ${MV(i)}"
      value="${d.stiglja != null ? (d.stiglja === i ? 252 : 0) : d.cards[i]}" ${d.stiglja != null ? 'disabled' : ''} oninput="cardIn(${i},this)">
    <div class="chips">${[20, 50, 100, 150, 200].map(v => `<button class="chip" onclick="addZv(${i},${v})">+${v}</button>`).join('')}
      <button class="chip ${d.stiglja === i ? 'on' : ''}" aria-pressed="${d.stiglja === i}" onclick="toggleStiglja(${i})">ŠTIGLJA</button>
      ${d.idx == null ? `<button class="chip red" onclick="belot(${i})">BELOT</button>` : ''}</div>
    <div class="listed">${d.zv[i].map((v, k) => `<button onclick="rmZv(${i},${k})" aria-label="Ukloni zvanje ${v}">${v} ✕</button>`).join('')}</div>
  </div>`;
  const pip = SUIT[SUITS[(d.idx ?? g.hands.length) % 4]]; // each hand gets the next suit
  return `<div class="entry"><span class="pip tr">${pip}</span><span class="pip bl">${pip}</span>
    ${d.idx != null ? `<h2 style="margin:10px 0 0">Ispravak ${d.idx + 1}. ruke</h2>` : ''}
    <span class="lbl">Tko je zvao adut?</span>
    <div class="row">${[0, 1].map(i => `<button class="btn ${d.caller === i ? 'on' : ''}" aria-pressed="${d.caller === i}" onclick="draft.caller=${i};render()">${MV(i)}</button>`).join('')}</div>
    <span class="lbl">Bodovi (drugi stupac se sam izračuna) i zvanja</span>
    <div class="cols">${col(0)}${col(1)}</div>
    <div class="preview" id="preview">${previewText()}</div>
    <div class="row"><button class="btn" onclick="draft=null;render()">Odustani</button>
      <button class="btn main" onclick="saveHand()">Spremi</button></div>
    ${d.idx != null ? `<p class="center" style="margin:12px 0 0"><button class="link bad" onclick="delHand()">obriši ovu ruku</button></p>` : ''}</div>`;
}
function cardIn(i, el) {
  const n = +el.value;
  if (el.value !== '' && !(Number.isInteger(n) && n >= 0 && n <= HAND)) el.value = draft.cards[i]; // reject a keystroke past 162
  const v = el.value;
  draft.cards[i] = v;
  draft.cards[1 - i] = v === '' ? '' : HAND - Number(v);
  $('#c' + (1 - i)).value = draft.cards[1 - i];
  $('#preview').innerHTML = previewText();
}
function addZv(i, v) { draft.zv[i].push(v); render(); }
function rmZv(i, k) { draft.zv[i].splice(k, 1); render(); }
function toggleStiglja(i) { draft.stiglja = draft.stiglja === i ? null : i; render(); }
function buildHand() {
  const d = draft, cards = d.cards.map(Number);
  if (d.caller == null) return 'Odaberi tko je zvao adut.';
  if (d.stiglja == null && (d.cards[0] === '' || !cards.every(n => Number.isInteger(n) && n >= 0 && n <= HAND)))
    return 'Upiši bodove (0–162).';
  const zv = [0, 1].map(i => zvOf(d, i));
  const { score, fell } = scoreHand({ caller: d.caller, cards, zvanja: zv, stiglja: d.stiglja });
  return { caller: d.caller, cards, zv: d.zv, bela: d.bela, stiglja: d.stiglja, score, fell };
}
function previewText() {
  const h = buildHand();
  return typeof h === 'string' ? `<span class="muted small">${h}</span>`
    : `MI ${h.score[0]} : ${h.score[1]} VI${h.fell ? ' <span class="bad">— PAD!</span>' : ''}`;
}
function saveHand() {
  const h = buildHand(), g = db.games.find(x => x.id === draft.gid), was = winner(g);
  if (typeof h === 'string') return alert(h);
  const hands = g.hands.slice(); hands[draft.idx ?? hands.length] = h;
  setHands(g, hands, was);
}
function delHand() {
  const g = db.games.find(x => x.id === draft.gid);
  setHands(g, g.hands.filter((_, k) => k !== draft.idx), winner(g));
}
function setHands(g, hands, was) {
  // a fix that reopens a finished game would leave two games in progress
  if (was != null && winner({ ...g, hands }) == null && active()) return alert('Ova ispravka bi ponovno otvorila igru, a druga je igra u tijeku. Prvo završi ili prekini tu igru.');
  g.hands = hands; draft = null; save();
  const w = winner(g);
  if (w != null && w !== was && view === 'game') { shownId = g.id; confetti(); }
  render();
}
function confetti() {
  const C = ['#d42f2a', '#3c9a3a', '#f3c51c', '#8a3b1e'], box = document.createElement('div');
  box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
  box.innerHTML = Array.from({ length: 36 }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${C[i % 4]};animation-duration:${1.8 + Math.random()}s;animation-delay:${Math.random() * .5}s;--x:${Math.round((Math.random() - .5) * 120)}px;--r:${Math.round(Math.random() * 720 - 360)}deg"></i>`).join('');
  document.body.append(box); setTimeout(() => box.remove(), 3500);
}
function belot(i) {
  const g = active();
  if (!confirm(`BELOT za ${MV(i)} (${teamName(g.teams[i])})? Igra odmah završava pobjedom.`)) return;
  g.belot = i; draft = null; pickBelot = false; shownId = g.id; save();
  render(); confetti();
}
function abandonGame() {
  const g = active();
  if (!confirm('Prekinuti i obrisati ovu igru?')) return;
  db.games = db.games.filter(x => x !== g); draft = null; pickBelot = false; save(); render();
}

/* ---------- Pregled igre (Povijest → tap na igru) ---------- */
function overview(g) {
  const w = winner(g), T = f => [0, 1].map(f), count = f => T(i => g.hands.filter(h => f(h, i)).length);
  const calls = count((h, i) => h.caller === i), falls = count((h, i) => h.caller === i && h.fell);
  const rows = [
    ['Zvali boju', calls],
    ['Prošli', T(i => calls[i] - falls[i])],
    ['Pali', falls],
    ['Zvanja', T(i => sum(g.hands.map(h => zvOf(h, i))))],
    ['Štiglje', count((h, i) => h.stiglja === i)],
    ['Bodovi', totals(g.hands)],
  ];
  return `<button class="link" onclick="histId=null;render()">‹ natrag na povijest</button>
    <h2 style="margin-top:6px">Igra br. ${gameNo(g)}</h2>
    <p class="st" style="margin:-4px 0 10px">${new Date(g.date).toLocaleDateString('hr-HR')} · do ${g.target} · ${g.hands.length} ruku ·
      ${w == null ? 'u tijeku' : `pobjeda ${MV(w)}${g.belot != null ? ' (belot)' : ''}`}</p>
    ${sheet(g, false)}
    <h2>Tijek igre</h2>
    <div class="legend">${T(i => `<span>${swatch(i)}${MV(i)} · ${esc(teamName(g.teams[i]))}</span>`).join('')}</div>
    ${g.hands.length ? chart(g) : '<p class="muted">Još nema upisanih ruku.</p>'}
    <h2>Statistika</h2>
    <table class="sheet stat">
      <thead><tr><th></th><th scope="col">MI</th><th scope="col">VI</th></tr></thead>
      <tbody>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${v[0]}</td><td>${v[1]}</td></tr>`).join('')}</tbody></table>
    <button class="link bad" style="margin-top:14px" onclick="delGame('${g.id}')">obriši igru</button>`;
}
// MI = solid line + circles, VI = dashed line + squares, so identity never relies on colour alone.
const swatch = i => `<svg width="26" height="10" aria-hidden="true"><line x1="1" y1="5" x2="25" y2="5" stroke="var(--${i ? 'vi' : 'mi'})" stroke-width="2" ${i ? 'stroke-dasharray="5 3"' : ''}/></svg>`;
function chart(g) {
  const W = 360, H = 230, L = 40, R = 52, T = 16, B = 26;
  const pts = [[0, 0]];
  for (const h of g.hands) { const p = pts.at(-1); pts.push([p[0] + h.score[0], p[1] + h.score[1]]); }
  const n = pts.length - 1, [a, b] = pts[n], yMax = Math.max(g.target, a, b);
  const x = k => L + k / n * (W - L - R), y = v => T + (1 - v / yMax) * (H - T - B);
  cd = { pts, n, W, x, g };
  const step = [50, 100, 200, 250, 500].find(s => yMax / s <= 5) || 1000;
  let grid = '';
  for (let v = 0; v <= yMax; v += step)
    grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--soft)">${v}</text>`;
  const every = Math.ceil(n / 10);
  let xl = '';
  for (let k = 0; k <= n; k += every) xl += `<text x="${x(k)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--soft)">${k}</text>`;
  const line = i => `<path d="${pts.map((p, k) => (k ? 'L' : 'M') + x(k) + ' ' + y(p[i])).join('')}" fill="none" stroke="var(--${i ? 'vi' : 'mi'})" stroke-width="2" stroke-linejoin="round" ${i ? 'stroke-dasharray="6 4"' : ''}/>`;
  const marks = i => pts.slice(1).map((p, k) => i
    ? `<rect x="${x(k + 1) - 4}" y="${y(p[1]) - 4}" width="8" height="8" fill="var(--vi)" stroke="var(--paper)" stroke-width="2"/>`
    : `<circle cx="${x(k + 1)}" cy="${y(p[0])}" r="4" fill="var(--mi)" stroke="var(--paper)" stroke-width="2"/>`).join('');
  let ya = y(a), yb = y(b);
  if (Math.abs(ya - yb) < 14) { const m = (ya + yb) / 2, up = ya <= yb ? -7 : 7; ya = m + up; yb = m - up; } // keep end labels apart
  return `<div class="chart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodovi kroz ${n} ruku: MI ${a}, VI ${b}"
      onpointermove="chartHover(event,this)" onpointerdown="chartHover(event,this)" onpointerleave="chartHover(null)">
      ${grid}
      ${g.target <= yMax ? `<line x1="${L}" x2="${W - R}" y1="${y(g.target)}" y2="${y(g.target)}" stroke="var(--soft)" stroke-dasharray="2 3"/>` : ''}
      ${xl}<text x="${W - R}" y="${H - 8}" text-anchor="start" dx="6" font-size="11" fill="var(--soft)">ruka</text>
      <line id="xh" y1="${T}" y2="${H - B}" stroke="var(--soft)" visibility="hidden"/>
      ${line(0)}${line(1)}${marks(0)}${marks(1)}
      <text x="${x(n) + 8}" y="${ya + 4}" font-size="13" fill="var(--ink)">MI ${a}</text>
      <text x="${x(n) + 8}" y="${yb + 4}" font-size="13" fill="var(--ink)">VI ${b}</text>
    </svg><div class="tip" id="tip" hidden></div></div>`;
}
function chartHover(e, svg) {
  const xh = $('#xh'), tip = $('#tip');
  if (!e || !cd) { xh?.setAttribute('visibility', 'hidden'); if (tip) tip.hidden = true; return; }
  const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * cd.W;
  const k = Math.max(1, Math.min(cd.n, Math.round((sx - cd.x(0)) / (cd.x(1) - cd.x(0)))));
  const px = cd.x(k);
  xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
  const h = cd.g.hands[k - 1];
  tip.innerHTML = `Ruka ${k}: MI ${cd.pts[k][0]} · VI ${cd.pts[k][1]}<br><span class="st">+${h.score[0]} / +${h.score[1]}${h.fell ? ' · pad' : ''}</span>`;
  tip.hidden = false;
  tip.style.left = Math.min(Math.max(px / cd.W * r.width, 80), r.width - 80) + 'px';
}

/* ---------- Igrači ---------- */
function stats(pid) {
  const s = { g: 0, w: 0, pts: 0, zv: 0, belot: 0, st: 0, pad: 0 };
  for (const g of db.games) {
    const t = g.teams.findIndex(tm => tm.includes(pid)), w = winner(g);
    if (t < 0 || w == null) continue; // only finished games count
    s.g++; if (w === t) s.w++; if (g.belot === t) s.belot++;
    for (const h of g.hands) {
      s.pts += h.score[t]; s.zv += zvOf(h, t);
      if (h.stiglja === t) s.st++;
      if (h.fell && h.caller === t) s.pad++;
    }
  }
  return s;
}
function playersView() {
  const head = p => `<div class="top"><span class="name">${esc(p.name)}</span><span style="flex:0 0 auto">
      <button class="icon" onclick="renamePlayer('${p.id}')" aria-label="Preimenuj ${esc(p.name)}">✎</button>
      <button class="icon bad" onclick="delPlayer('${p.id}')" aria-label="Obriši ${esc(p.name)}">✕</button></span></div>`;
  const guests = db.players.filter(p => p.guest).sort((a, b) => a.name.localeCompare(b.name, 'hr'))
    .map(p => `<div class="line">${head(p)}<div class="st">statistika se ne prati</div></div>`).join('');
  const list = db.players.filter(p => !p.guest).map(p => ({ p, s: stats(p.id) })).sort((a, b) => b.s.w - a.s.w).map(({ p, s }) => `
    <div class="line">${head(p)}
      <div class="st">${s.g} igara · ${s.w} pobjeda${s.g ? ` (${Math.round(s.w / s.g * 100)}%)` : ''} · ${s.pts} bodova</div>
      <div class="st">zvanja ${s.zv} · belot ${s.belot} · štiglje ${s.st} · padovi ${s.pad}</div></div>`).join('');
  return `<h2>Igrači</h2>
    <form class="row" onsubmit="addPlayer(event)"><input id="pname" placeholder="Upiši ime…" maxlength="30" autocomplete="off" aria-label="Ime igrača">
    <button class="btn" style="flex:0 0 auto">Dodaj</button>
</form>
    ${list || (guests ? '' : fan('big') + '<p class="muted center">Još nema igrača.</p>')}
    ${guests ? `<h2>Gosti</h2><p class="st" style="margin-top:-4px">Dodaju se na stranici Igra. Ne vodi im se statistika.</p>${guests}` : ''}`;
}
const nameTaken = (n, except) => db.players.some(p => p.id !== except && p.name.toLowerCase() === n.toLowerCase());
function addPlayer(e) {
  e.preventDefault();
  const n = $('#pname').value.trim();
  if (!n) return;
  if (nameTaken(n)) return alert('Igrač s tim imenom već postoji.');
  db.players.push({ id: uid(), name: n }); save(); render(); $('#pname').focus();
}
function renamePlayer(id) {
  const p = db.players.find(x => x.id === id), n = prompt('Novo ime:', p.name)?.trim();
  if (!n) return;
  if (nameTaken(n, id)) return alert('Igrač s tim imenom već postoji.');
  p.name = n; save(); render();
}
function delPlayer(id) {
  if (db.games.some(g => g.teams.flat().includes(id))) return alert('Igrač ima odigrane igre pa se ne može obrisati (statistika bi se izgubila).');
  if (confirm(`Obrisati ${pname(id)}?`)) { db.players = db.players.filter(p => p.id !== id); save(); render(); }
}

/* ---------- Turnir ---------- */
const champion = t => bracket(t.teams.length, t.wins).at(-1)[0].w;
const ROUND = (r, n) => ['Finale', 'Polufinale', 'Četvrtfinale'][n - 1 - r] ?? `${r + 1}. kolo`;
function tourView() {
  const open = db.tournaments.find(t => t.id === tid);
  if (open) return bracketView(open);
  const list = tourList(db.tournaments.filter(t => champion(t) == null));
  return `${list ? '<h2>U tijeku</h2>' + list : ''}
    <h2>Novi turnir</h2>
    <input id="tname" placeholder="Naziv turnira" maxlength="40" autocomplete="off" aria-label="Naziv turnira">
    <span class="lbl">Timovi, jedan po retku</span>
    <textarea id="tteams" rows="6" placeholder="Ana &amp; Ivo&#10;Marko &amp; Luka&#10;…" aria-label="Timovi, jedan po retku"></textarea>
    <div class="row pick" style="margin-top:12px"><label><input type="checkbox" id="tshuf" checked><span>Ždrijeb (nasumični parovi)</span></label></div>
    <button class="btn main wide" style="width:100%;margin-top:14px" onclick="newTour()">Napravi turnir</button>
    <p class="st">Gotovi turniri su pod Povijest → Povijest braketa.</p>`;
}
const tourList = ts => ts.sort((a, b) => b.date - a.date).map(t => {
  const c = champion(t), n = t.teams.length;
  return `<button class="line item" onclick="tid='${t.id}';render();scrollTo(0,0)"><span class="body"><span class="name">${esc(t.name)}</span>
    <span class="st">${new Date(t.date).toLocaleDateString('hr-HR')} · ${n} ${plural(n, 'tim', 'tima', 'timova')} · ${c == null ? '<u>u tijeku</u>' : 'pobjednik: ' + esc(t.teams[c])}</span></span>
    <span class="st">›</span></button>`;
}).join('');
function newTour() {
  const teams = [...new Set($('#tteams').value.split(/\r?\n/).map(s => s.trim().slice(0, 40)).filter(Boolean))];
  if (teams.length < 2) return alert('Upiši barem 2 tima, svaki u svoj redak.');
  if ($('#tshuf').checked) for (let i = teams.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [teams[i], teams[j]] = [teams[j], teams[i]]; }
  const t = { id: uid(), name: $('#tname').value.trim() || 'Turnir', date: Date.now(), teams, wins: {} };
  db.tournaments.push(t); tid = t.id; save(); render(); scrollTo(0, 0);
}
function bracketView(t) {
  const rounds = bracket(t.teams.length, t.wins), c = champion(t);
  const side = (r, m, x, team) => team == null
    ? `<span class="tm muted">${r === 0 ? 'slobodan' : '…'}</span>`
    : `<button class="tm ${x.w === team ? 'win' : x.w != null ? 'out' : ''}" onclick="setWin(${r},${m},${team})" ${x.a == null || x.b == null ? 'disabled' : ''}>${esc(t.teams[team])}${x.w === team ? ' ✓' : ''}</button>`;
  const cols = rounds.map((ms, r) => `<div class="rnd"><div class="rh">${ROUND(r, rounds.length)}</div><div class="ms">
    ${ms.map((x, m) => `<div class="match">${side(r, m, x, x.a)}${side(r, m, x, x.b)}</div>`).join('')}</div></div>`).join('');
  return `<button class="link" onclick="tid=null;render()">‹ natrag</button>
    <div class="hhead"><h2 style="margin-top:6px">${esc(t.name)}</h2><button class="icon" onclick="renameTour()" aria-label="Preimenuj turnir">✎</button></div>
    ${c != null ? `<div class="flash" role="status">${SUIT.zvono}Pobjednik: ${esc(t.teams[c])}!</div>` : '<p class="st">Dodirni tim koji je pobijedio. Ponovni dodir poništava.</p>'}
    <div class="bracket">${cols}</div>
    <h2>Timovi</h2>
    ${t.teams.map((n, i) => `<div class="line"><div class="top"><span class="name">${esc(n)}</span><span style="flex:0 0 auto">
      <button class="icon" onclick="renameTeam(${i})" aria-label="Preimenuj ${esc(n)}">✎</button>
      <button class="icon bad" onclick="removeTeam(${i})" aria-label="Makni ${esc(n)}">✕</button></span></div></div>`).join('')}
    <form class="row" style="margin-top:8px" onsubmit="event.preventDefault();addTeam()"><input id="tnew" placeholder="Dodaj tim…" maxlength="40" autocomplete="off" aria-label="Novi tim">
      <button class="btn" style="flex:0 0 auto">Dodaj</button></form>
    <button class="link bad" style="margin-top:14px" onclick="delTour()">obriši turnir</button>`;
}
function setWin(r, m, team) {
  const t = db.tournaments.find(x => x.id === tid), k = r + '-' + m, was = champion(t), x = $('.bracket').scrollLeft;
  if (t.wins[k] === team) delete t.wins[k]; else t.wins[k] = team;
  save(); render(); $('.bracket').scrollLeft = x; // keep the bracket where it was scrolled
  const c = champion(t);
  if (c != null && c !== was) confetti();
}
function renameTeam(i) {
  const t = db.tournaments.find(x => x.id === tid), n = prompt('Novo ime tima:', t.teams[i])?.trim().slice(0, 40);
  if (!n) return;
  if (t.teams.some((x, j) => j !== i && x === n)) return alert('Tim s tim imenom već postoji.');
  t.teams[i] = n; save(); render();
}
// Applies a change to the open tournament; asks first if it would throw away results that no longer fit the bracket.
function changeTour(fn) {
  const t = db.tournaments.find(x => x.id === tid), c = structuredClone(t);
  fn(c); c.wins = liveWins(c.teams.length, c.wins);
  const lost = Object.keys(liveWins(t.teams.length, t.wins)).length - Object.keys(c.wins).length;
  if (lost > 0 && !confirm(`Ova promjena briše ${lost} ${plural(lost, 'rezultat', 'rezultata', 'rezultata')} koji više ne odgovaraju braketu. Nastaviti?`)) return;
  Object.assign(t, c); save(); render();
}
function addTeam() {
  const n = $('#tnew').value.trim().slice(0, 40), t = db.tournaments.find(x => x.id === tid);
  if (!n) return;
  if (t.teams.includes(n)) return alert('Tim s tim imenom već postoji.');
  changeTour(c => c.teams.push(n));
}
function removeTeam(i) {
  const t = db.tournaments.find(x => x.id === tid);
  if (t.teams.length <= 2) return alert('Turnir mora imati barem 2 tima.');
  if (!confirm(`Maknuti ${t.teams[i]} iz turnira?`)) return;
  changeTour(c => { // last team takes the free slot, so nobody else moves
    const last = c.teams.length - 1;
    for (const k in c.wins) if (c.wins[k] === i) delete c.wins[k]; else if (c.wins[k] === last) c.wins[k] = i;
    c.teams[i] = c.teams[last]; c.teams.pop();
  });
}
function renameTour() {
  const t = db.tournaments.find(x => x.id === tid), n = prompt('Naziv turnira:', t.name)?.trim().slice(0, 40);
  if (n) { t.name = n; save(); render(); }
}
function delTour() {
  if (!confirm('Obrisati ovaj turnir?')) return;
  db.tournaments = db.tournaments.filter(t => t.id !== tid); tid = null; save(); render();
}

/* ---------- Povijest ---------- */
let openDays = null;
const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? few : many;
function historyView() {
  const open = db.games.find(g => g.id === histId), tour = db.tournaments.find(t => t.id === tid);
  if (open) return overview(open);
  if (tour) return bracketView(tour);
  const tabs = `<div class="row pick" style="margin:6px 0 4px">${[['games', 'Povijest igara'], ['tours', 'Povijest braketa']].map(([k, l]) =>
    `<label><input type="radio" name="htab" ${histTab === k ? 'checked' : ''} onchange="histTab='${k}';render()"><span>${l}</span></label>`).join('')}</div>`;
  const days = [];
  for (const g of db.games.slice().sort((a, b) => b.date - a.date)) {
    const k = new Date(g.date).toDateString();
    if (days.at(-1)?.k !== k) days.push({ k, games: [] });
    days.at(-1).games.push(g);
  }
  openDays ??= new Set(days.slice(0, 1).map(d => d.k)); // newest day starts open
  const item = g => {
    const t = totals(g.hands), w = winner(g);
    const no = gameNo(g);
    return `<button class="line item" onclick="histId='${g.id}';render();scrollTo(0,0)">
      <span class="no">${no}<i>${SUIT[SUITS[(no - 1) % 4]]}</i></span><span class="body"><span class="st">${new Date(g.date).toLocaleTimeString('hr-HR', { timeStyle: 'short' })}
      · do ${g.target} · ${g.hands.length} ruku${g.belot != null ? ' · BELOT' : ''}${w == null ? ' · <u>u tijeku</u>' : ''}</span>
      ${[0, 1].map(i => `<span class="hrow ${w === i ? 'win' : ''}"><span>${MV(i)} · ${esc(teamName(g.teams[i]))}${w === i ? ' ✓' : ''}</span><span>${t[i]}</span></span>`).join('')}
      <span class="st" style="text-align:right">pregled ›</span></span></button>`;
  };
  const games = days.map(d => {
    const date = new Date(d.games[0].date).toLocaleDateString('hr-HR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }), n = d.games.length;
    return `<details class="day" ${openDays.has(d.k) ? 'open' : ''} ontoggle="openDays[this.open ? 'add' : 'delete']('${d.k}')">
      <summary><span>${date[0].toUpperCase() + date.slice(1)}</span><span class="muted small">${n} ${plural(n, 'igra', 'igre', 'igara')}</span></summary>
      ${d.games.map(item).join('')}</details>`;
  }).join('');
  const n = db.games.length;
  const list = histTab === 'tours'
    ? tourList(db.tournaments.slice()) || fan('big') + '<p class="muted center">Još nema turnira.</p>'
    : games || fan('big') + '<p class="muted center">Još nema igara.</p>';
  return `<div class="hhead"><h2>Povijest</h2>${n && histTab === 'games' ? `<button class="chip" onclick="toggleAllDays()" aria-label="Ukupno ${n} ${plural(n, 'igra', 'igre', 'igara')}, otvori ili zatvori sve dane">Σ ${n} ${plural(n, 'igra', 'igre', 'igara')}</button>` : ''}</div>
    ${tabs}${list}
    <h2>Sigurnosna kopija</h2>
    <p class="st">Spremi sve igrače, igre, turnire i statistiku (npr. u iCloud ili pošalji sebi), ili ih vrati iz kopije.</p>
    <div class="row"><button class="btn" onclick="exportBackup()">Izvezi</button>
      <button class="btn" onclick="$('#imp').click()">Uvezi</button>
      ${window.Capacitor ? `<button class="btn" onclick="const t=prompt('Zalijepi kopiju:');if(t)importText(t)">Zalijepi</button>` : ''}</div>
    <input type="file" id="imp" accept=".json,application/json" hidden onchange="importBackup(this)">`;
}
function toggleAllDays() {
  const keys = [...new Set(db.games.map(g => new Date(g.date).toDateString()))];
  openDays = keys.every(k => openDays.has(k)) ? new Set() : new Set(keys); render();
}
function delGame(id) { if (confirm('Obrisati igru iz povijesti? Statistika igrača će se promijeniti.')) { db.games = db.games.filter(g => g.id !== id); histId = null; draft = null; save(); render(); } }

async function exportBackup() {
  const file = new File([JSON.stringify(db)], `bela-blok-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
  // iPhone: share sheet (Spremi u Datoteke / AirDrop / poruka). Elsewhere: plain download.
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file] }); } catch {} return; }
  if (window.Capacitor) { // native app webview can't download files: hand the backup over as text
    try { await navigator.clipboard.writeText(JSON.stringify(db)); alert('Kopija je kopirana u međuspremnik. Zalijepi je u Bilješke ili poruku. Vraćaš je gumbom „Zalijepi”.'); }
    catch { alert('Izvoz nije uspio.'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importBackup(input) {
  const f = input.files[0]; input.value = '';
  if (!f) return;
  importText(await f.text());
}
function importText(txt) {
  let d;
  try { d = JSON.parse(txt); } catch { return alert('Kopija nije ispravna.'); }
  if (!validBackup(d)) return alert('Ovo nije Bela Blok sigurnosna kopija.');
  if (!confirm(`Uvesti ${d.players.length} igrača i ${d.games.length} igara? Trenutni podaci bit će ZAMIJENJENI.`)) return;
  db = { players: d.players, games: d.games, tournaments: d.tournaments ?? [], theme: db.theme }; draft = null; save(); render();
}

$('#hfan').innerHTML = fan();
document.querySelectorAll('nav i[data-s]').forEach(e => e.innerHTML = SUIT[e.dataset.s]);
applyTheme(); render();
addEventListener('resize', placeInd); document.fonts?.ready.then(placeInd);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
